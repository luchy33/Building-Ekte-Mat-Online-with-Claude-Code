{% extends "base.html" %}
{% from "_macros.html" import csrf_field %}
{% block title %}Log in – Ekte Mat Online{% endblock %}
{% block content %}
  <h2>Log in</h2>
  {% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" class="stacked" action="{{ url_for('account.login') }}">
    {{ csrf_field() }}
    <input type="hidden" name="next" value="{{ next_url }}">
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" value="{{ email }}" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>
    <p><button type="submit">Log in</button></p>
  </form>
  <p>New customer? <a href="{{ url_for('account.register', next=next_url) if next_url else url_for('account.register') }}">Create an account</a>.</p>
{% endblock %}
